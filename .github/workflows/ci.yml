name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra embed
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - uses: actions/cache@v4
        with:
          path: data/raw/usda
          key: usda-${{ hashFiles('src/macroswap/manifest.toml') }}
      - run: uv run macroswap data pull
      - id: model
        run: echo "revision=$(uv run python -c 'from macroswap.config import load_config; print(load_config().match.revision)')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: model-${{ steps.model.outputs.revision }}
      - run: uv run pytest
        env:
          MACROSWAP_REQUIRE_DATA: "1"
      - name: The README's eval block is the committed table
        run: uv run python scripts/render_eval.py && git diff --exit-code README.md
      - name: The popularity page is the committed table
        run: uv run python scripts/render_popularity.py && git diff --exit-code docs/popularity.md
      - name: The README's known misses are the acceptance file
        run: uv run python scripts/render_misses.py && git diff --exit-code README.md
      - name: The config, the manifest and the license ship inside the wheel
        run: |
          uv build --wheel --out-dir dist
          uv run python -c "import glob, sys, zipfile; wheel = glob.glob('dist/*.whl')[0]; names = zipfile.ZipFile(wheel).namelist(); missing = [n for n in ('macroswap/macroswap.toml', 'macroswap/manifest.toml') if n not in names] + [n for n in ('LICENSE',) if not any(m.endswith('/licenses/' + n) for m in names)]; sys.exit(f'{missing} missing from {wheel}' if missing else 0)"
      - name: The wheel runs without the embed extra, from any directory
        run: |
          uv venv /tmp/bare
          uv pip install --python /tmp/bare dist/*.whl
          /tmp/bare/bin/macroswap --help
          /tmp/bare/bin/macroswap --version
          mkdir /tmp/empty && cd /tmp/empty
          if /tmp/bare/bin/macroswap data build 2>err; then exit 1; fi
          grep -q 'run `data pull` first' err
      - name: No private paths tracked
        run: |
          if git ls-files data/raw data/build docs/private ':(glob)**/*.sqlite*' ':(glob)**/embeddings-*.npy*' | grep -q .; then
            echo "private paths are tracked" >&2
            exit 1
          fi
          if git ls-files ':(glob)**/mfp_*.html' | grep -v '^tests/fixtures/' | grep -q .; then
            echo "a diary export is tracked" >&2
            exit 1
          fi
