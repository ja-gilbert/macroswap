[usda.family_aliases]
"cod, pacific or alaskan" = "fish, cod"
"tuna, ahi or yellowfin" = "fish, tuna"
"lentils, dry" = "lentils"
"bananas, overripe" = "bananas"
"bananas, ripe and slightly ripe" = "bananas"
"oats, whole grain" = "cereals, oats"
"oats" = "cereals, oats"
