[project]
name = "macroswap"
version = "0.1.0"
description = "Macro-equivalent food swaps from a MyFitnessPal diary and USDA data."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jamie Gilbert" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=6.1,<7", "torch>=2.14"]

[project.urls]
Repository = "https://github.com/ja-gilbert/macroswap"

[project.scripts]
macroswap = "macroswap.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.16",
    "mypy>=2.3",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "scripts"]
# Module names from paths, since the two test tiers share file names.
mypy_path = "src"
explicit_package_bases = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["rank_bm25"]
ignore_missing_imports = true

# Following imports into torch, transformers and sentence-transformers costs
# mypy half a minute; everything else stays strict.
[[tool.mypy.overrides]]
module = [
    "sentence_transformers",
    "sentence_transformers.*",
    "torch",
    "torch.*",
    "transformers",
    "transformers.*",
]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib, since the two test tiers share file names.
addopts = "-ra --import-mode=importlib"
filterwarnings = ["error"]
