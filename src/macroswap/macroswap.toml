"mango" = "mangos"
"avocado, hass" = "avocados"
"plum, black" = "plums"
"tomato, roma" = "tomatoes"
"corn flour, masa harina" = "corn flour"
"flour, corn" = "corn flour"
"flour, rye" = "rye flour"
"flour, semolina" = "semolina"
"sorghum, whole grain" = "sorghum grain"
"khorasan, grain" = "wheat"
"flour, 00" = "wheat flour"
"flour, pastry" = "wheat flour"
"cheese, cotija" = "cheese, mexican"
"peppers, bell" = "peppers, sweet"
"tomatoes, canned" = "tomatoes, red"
"tomatoes, whole" = "tomatoes, red"
"tomato, sauce" = "tomato sauce, canned"
"tomato, puree" = "tomato products, canned"
