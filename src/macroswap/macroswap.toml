"salami, hard" = "salami, dry or hard"
"lunchmeat, ham" = "ham, sliced"

# Ground-meat leanness families. Anchors are SR NDB numbers with their label
# level; retail levels between anchors become derived rows. The default is the
# level a swap shows for the family when the diary logs none.
[[usda.leanness]]
family = "beef, ground"
# SR's ground beef is label-nominal: fat is exactly 100 minus lean.
nominal = true
anchors = { "13498" = "70/30", "23577" = "75/25", "23572" = "80/20", "23567" = "85/15", "23562" = "90/10", "23472" = "93/7", "23557" = "95/5", "23477" = "97/3" }
retail = ["73/27", "88/12", "92/8", "94/6", "96/4"]
default = "85/15"

[[usda.leanness]]
family = "turkey, ground"
nominal = false
# 5662 is "fat free", measured at 1.95 g fat per 100 g; it enters as 99/1.
anchors = { "5668" = "85/15", "5665" = "93/7", "5662" = "99/1" }
retail = []
default = "93/7"

[[usda.leanness]]
family = "pork, ground"
nominal = false
anchors = { "10972" = "84/16", "10973" = "96/4" }
retail = []
default = "84/16"

[match]
# Expanded wherever they stand as whole words, in names and descriptions alike;
# an empty expansion drops the word, as for a brand word matching a rare USDA one.
abbreviations = { "w/" = "with", "w/o" = "without", "bnls" = "boneless", "&" = "and", "generic" = "" }
# Up to this many hits per method, each a distinct key.
top_k = 5
# BM25's length normalization, 0 to 1: at 0.75 a short index text outscores a
# longer one holding the same words. Lowered on the dev split if the labels
# show that bias against plain names such as "white rice".
bm25_b = 0.75
# The frozen embedder behind the embed extra, pinned to one revision.
model = "sentence-transformers/all-MiniLM-L6-v2"
revision = "1110a243fdf4706b3f48f1d95db1a4f5529b4d41"
# Embedding the real table's index takes about 15 s on two CPU threads; the
# data tier fails above four times that, so a slow model shows.
index_seconds = 60.0
# What `diary match` runs: the dev winner, a tie going to the simpler method.
default_method = "embed"
# Reciprocal rank fusion: each method adds 1 / (rrf_k + rank) to a hit.
rrf_k = 60

# A method abstains (NO_MATCH) when its top score is below its threshold; -inf
# never abstains on a score. Hybrid abstains only when its top row is below
# both, a row a method does not score counting as below it.
# `macroswap match eval` prints each method's dev-optimal line, ready to paste
# here: the cut, -inf or midway between adjacent top scores, that gets the most
# names in the whole dev split right end to end at top 1, an abstention counted
# wrong unless the label is NO_MATCH; a tie goes to the lowest cut.
[match.no_match]
lexical = 7.687868399668144  # dev-optimal: 55 of 139 right; 31 dev names labeled NO_MATCH
embed = 0.6755481362342834  # dev-optimal: 63 of 139 right; 31 dev names labeled NO_MATCH

[labels]
# The head is the fewest names covering this share of counted rows; the tail
# is a seeded sample of tail_size names from the rest.
head_share = 0.8
tail_size = 150
# Within each bucket the first dev_share of a seeded shuffle is dev, the rest test.
dev_share = 0.3
seed = 20260926
# Rows a /text search in the labeler lists.
search_limit = 25

[eval]
# Each cell's interval: a seeded bootstrap over names.
bootstrap_resamples = 2000
bootstrap_seed = 20260926
interval = 0.95
# CI compares the eval with the committed expected table: exactly for lexical,
# within this many flipped names per cell otherwise (CPU and GPU float noise).
tolerated_flips = { lexical = 0, embed = 1, hybrid = 1 }

[popularity]
# The NHANES cycle the participants are counted in. `data build` refuses survey
# foods dated to any other: the popularity floor and the common threshold are
# absolute counts, and mean what they do in this cycle's counts alone.
cycle = "2021-2023"
# Water is never the food: an FNDDS food counts toward the family of its
# largest ingredient outside these families, and toward water only when it is
# all water, so oatmeal made with water counts as oats.
water_families = ["beverages, water", "water, bottled"]
# The staples: a threshold that left one of them out of the first tier would be
# wrong, so the data tier holds each at or above common_threshold.
must_pass = [
    "chicken, breast", "beef, ground", "turkey, ground", "pork, loin",
    "fish, tilapia", "fish, cod", "crustaceans, shrimp", "fish, tuna",
    "fish, salmon", "egg, whole", "egg, white", "yogurt, greek", "cheese, cottage",
    "beverages, protein powder whey based", "rice, white", "potatoes",
    "sweet potato", "cereals, oats", "bread", "pasta, dry",
    "beans, black", "lentils", "bananas",
]
# Offered in the first tier whatever their count: ordinary foods the recalls
# rarely name.
allowlist = ["game meat, bison", "cereals, cream of rice"]

# Family -> family, read by the participant counts alone: a cooked or parallel
# key whose count belongs to the family a swap can offer. One hop: the target
# is a candidate family and never itself a source. Each line was confirmed from
# the measured counts. A product form the table keeps out of a family (french
# fries, sweet potato fries) stays out here too.
[popularity.count_as]
"peanuts, all types" = "peanuts"
"broccoli, chopped" = "broccoli"
"cauliflower, drained" = "cauliflower"
"quinoa" = "quinoa, uncooked"
"rice noodles" = "rice noodles, dry"
"chicken patty" = "chicken patty, uncooked"
"brussels sprouts, drained" = "brussels sprouts"
"couscous" = "couscous, dry"
"okra, drained" = "okra"
"buckwheat groats" = "buckwheat groats, dry"
"collards, chopped" = "collards"
"bulgur" = "bulgur, dry"
"lotus root, drained" = "lotus root"
"kale, drained" = "kale"
"pumpkin flowers, drained" = "pumpkin flowers"
"parsnips, drained" = "parsnips"
"pasta" = "pasta, dry"
"potatoes, flesh" = "potatoes"
"potatoes, flesh and skin" = "potatoes"
"spinach, chopped or leaf" = "spinach"
"turnip greens, drained" = "turnip greens"
"onions, whole" = "onions"
"onions, drained" = "onions"
"asparagus, drained" = "asparagus"
"carrots, drained" = "carrots"
"cowpeas, immature seeds" = "cowpeas"
"peas, split" = "peas, green"
"sweet potatoes, orange flesh" = "sweet potato"
"bison, ground" = "game meat, bison"

# Family -> WWEIA food category, a sanity check on the link rule and not a
# validation: beside the family's count, the committed table holds how many
# participants reported any food NHANES files under the category. `data build`
# refuses a line whose family the table lacks or whose category no survey food
# is filed under.
[popularity.crosswalk]
"chicken, breast" = "Chicken, whole pieces"
"beef, ground" = "Ground beef"
"rice, white" = "Rice"
"egg, whole" = "Eggs and omelets"
