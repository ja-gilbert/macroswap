# The swaps I would accept, and the ones I call absurd, for the data tier's
# acceptance test: each source is typed text plus grams against the USDA table
# alone, the participant counts on and no diary, under the default method.
# Marked on 2026-10-06 from the command's first 25 per source; a row here is
# the specification, and a rule change that breaks one is fixed in the rule.
# The command offers nothing without counts, so the file promises nothing
# without them.
#
# accept: family keys that must be among the first 25 family rows, the rows of
# `--top 25` the marks were made on (the command prints ten by default).
# absurd: family keys that must not be among those 25.
# known_misses: swaps the command offers in the first 25 that survive the four
# rules (the shared pool, the serving ratio, the vegetable rule and the floor)
# and get no fifth; one entry per reason, with the pairs it covers.
# Each pair is held to the first 25 the way an accepted swap is: a miss that
# stops being offered fails the suite and its line goes, so the README's
# limits stay measured, not remembered.
#
# Not asserted, by my rulings of 2026-10-02 and 2026-10-06 (known limits):
# - whole eggs for chicken breast: 231 g of egg carries 19 g more fat than the breast.
# - salmon for chicken breast: farmed Atlantic has 10 g more fat per 100 g; the canned
#   pink row, 2.8 g over, is a technicality, not the food meant.
# - ricotta and whole eggs for cottage cheese: 6 to 7 g more fat.
# - a ready-to-eat cereal for oats: FNDDS builds every such cereal from grain, flour
#   and sugar, not from the cereal's own row, so no ready-to-eat family reaches the floor.
# - cream of wheat for oats: 26 participants, less common, rank 67.

