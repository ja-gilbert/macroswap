# The swaps I would accept, and the ones I call absurd, for the data tier's
# acceptance test: each source is typed text plus grams against the USDA table
# alone, no diary, under the default method. Marked on 2026-10-02 from the
# engine's top 25 per source; a row here is the specification, and a rule change
# that breaks one is fixed in the rule.
#
# accept: family keys that must be among the first 25 family rows, the rows of
# `--top 25` the marks were made on (the command prints ten by default).
# absurd: family keys that must not be among those 25.
# requires = "popularity": the same two kinds, asserted once the popularity table
# is built. Today every family counts as common and the rows above an accepted
# family are foods nobody buys, or the absurd family is one that only the
# popularity floor removes. A tagged family that still fails then is a
# conversation, not a loosened row.
#
# Not asserted, by my rulings of 2026-10-02 (known limits):
# - whole eggs for chicken breast: 231 g of egg carries 19 g more fat than the breast.
# - salmon for chicken breast: farmed Atlantic has 10 g more fat per 100 g; the canned
#   pink row, 2.8 g over, is a technicality, not the food meant.
# - ribeye for salmon: 5 g of fat off either way (lean only -5.1, lean and fat +5.1).
# - tuna and chicken breast for Greek yogurt, Greek yogurt for egg whites: 170 g of
#   nonfat Greek yogurt carries 6 g of carbs no meat or egg white has.
# - ricotta, mozzarella and whole eggs for cottage cheese: 6 to 7 g more fat.
# - shredded wheat for oats: its family, cereals ready-to-eat, post, offers Alpha-Bits
#   first, so a family row would mean nothing.
# - dry pasta for white rice, potatoes, sweet potato and brown rice: 2 to 4 g of protein
#   over at the carbs, behind common fruit and vegetables; expected back if the carb
#   pool splits into starch and sugar at milestone 5.
# - rice cakes (Snacks), pork sausage and bratwurst (Sausages and Luncheon Meats):
#   excluded categories, so no tag can admit them. Jerky is present, through the
#   Snacks allow word; sausages are not. At milestone 5 rice cakes is one allow
#   word in Snacks, the route jerky already takes.

